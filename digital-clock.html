<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>多時區數字時鐘</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, '微軟正黑體';
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #7e8ba3 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 40px rgba(100, 200, 255, 0.3);
            max-width: 900px;
            width: 100%;
            animation: slideIn 0.8s ease-out;
            border: 2px solid rgba(100, 200, 255, 0.2);
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: transparent;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            transform: scale(1.2);
        }
        
        .emoji {
            font-size: 50px;
            margin-bottom: 15px;
        }
        
        h1 {
            color: #64c8ff;
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }
        
        .subtitle {
            color: #aaa;
            font-size: 1em;
        }
        
        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .clock-card {
            background: linear-gradient(135deg, rgba(50, 100, 150, 0.5) 0%, rgba(30, 60, 100, 0.8) 100%);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid rgba(100, 200, 255, 0.3);
            text-align: center;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        }
        
        .clock-card:hover {
            transform: translateY(-5px);
            border-color: rgba(100, 200, 255, 0.6);
            box-shadow: 0 12px 30px rgba(100, 200, 255, 0.2);
        }
        
        .city-name {
            color: #64c8ff;
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(100, 200, 255, 0.3);
        }
        
        .time-display {
            color: #00ff00;
            font-size: 2.5em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            margin-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            letter-spacing: 2px;
        }
        
        .date-display {
            color: #aaa;
            font-size: 0.95em;
            margin-bottom: 5px;
        }
        
        .timezone-info {
            color: #888;
            font-size: 0.85em;
            border-top: 1px solid rgba(100, 200, 255, 0.2);
            padding-top: 10px;
            margin-top: 10px;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        
        .btn {
            padding: 10px 20px;
            font-size: 0.95em;
            border: 2px solid #64c8ff;
            background: transparent;
            color: #64c8ff;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }
        
        .btn:hover {
            background: #64c8ff;
            color: #1e3c72;
            box-shadow: 0 0 20px rgba(100, 200, 255, 0.5);
        }
        
        .btn:active {
            transform: scale(0.95);
        }
        
        .info-box {
            background: rgba(100, 200, 255, 0.1);
            border: 1px solid rgba(100, 200, 255, 0.3);
            padding: 15px;
            border-radius: 10px;
            color: #aaa;
            font-size: 0.9em;
            text-align: center;
        }
        
        .local-time-section {
            background: rgba(0, 255, 0, 0.05);
            border: 2px solid rgba(0, 255, 0, 0.2);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .local-label {
            color: #64c8ff;
            font-size: 1em;
            margin-bottom: 10px;
        }
        
        .local-time {
            color: #00ff00;
            font-size: 3em;
            font-weight: bold;
            font-family: 'Courier New', monospace;
            text-shadow: 0 0 15px rgba(0, 255, 0, 0.5);
            letter-spacing: 2px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <a href="index.html" class="back-btn" title="回到首頁">🏠</a>
                <div></div>
            </div>
            <div class="emoji">🌍 ⏰</div>
            <h1>多時區數字時鐘</h1>
            <p class="subtitle">實時顯示全球不同時區的當前時間</p>
        </div>
        
        <div class="local-time-section">
            <div class="local-label">📍 你的本地時間</div>
            <div class="local-time" id="localTime">00:00:00</div>
        </div>
        
        <div class="controls">
            <button class="btn" onclick="addClock()">➕ 添加時區</button>
            <button class="btn" onclick="resetClocks()">🔄 重置</button>
        </div>
        
        <div class="clocks-grid" id="clocksContainer">
            <!-- 時鐘卡片將動態插入這裡 -->
        </div>
        
        <div class="info-box">
            💡 提示：點擊時鐘卡片可以移除，點擊「添加時區」可以添加更多城市，「重置」可回到預設城市列表
        </div>
    </div>

    <script>
        // 預設時區列表
        const defaultCities = [
            { name: '台北', timezone: 'Asia/Taipei' },
            { name: '東京', timezone: 'Asia/Tokyo' },
            { name: '香港', timezone: 'Asia/Hong_Kong' },
            { name: '曼谷', timezone: 'Asia/Bangkok' },
            { name: '新加坡', timezone: 'Asia/Singapore' },
            { name: '杜拜', timezone: 'Asia/Dubai' },
            { name: '倫敦', timezone: 'Europe/London' },
            { name: '紐約', timezone: 'America/New_York' },
            { name: '舊金山', timezone: 'America/Los_Angeles' },
            { name: '雪梨', timezone: 'Australia/Sydney' },
            { name: '莫斯科', timezone: 'Europe/Moscow' },
            { name: '巴黎', timezone: 'Europe/Paris' }
        ];
        
        const moreCities = [
            { name: '柏林', timezone: 'Europe/Berlin' },
            { name: '斯德哥爾摩', timezone: 'Europe/Stockholm' },
            { name: '孟買', timezone: 'Asia/Kolkata' },
            { name: '首爾', timezone: 'Asia/Seoul' },
            { name: '吉隆坡', timezone: 'Asia/Kuala_Lumpur' },
            { name: '雅加達', timezone: 'Asia/Jakarta' },
            { name: '馬尼拉', timezone: 'Asia/Manila' },
            { name: '溫哥華', timezone: 'America/Vancouver' },
            { name: '墨西哥城', timezone: 'America/Mexico_City' },
            { name: '聖保羅', timezone: 'America/Sao_Paulo' }
        ];
        
        let cities = [...defaultCities];
        
        // 格式化時間
        function formatTime(date) {
            return date.toLocaleTimeString('zh-TW', { hour12: false });
        }
        
        // 格式化日期
        function formatDate(date) {
            return date.toLocaleDateString('zh-TW', { 
                year: 'numeric', 
                month: '2-digit', 
                day: '2-digit' 
            });
        }
        
        // 獲取時差信息
        function getTimezoneOffset(timezone) {
            const now = new Date();
            const utcTime = new Date(now.toLocaleString('en-US', { timeZone: 'UTC' }));
            const tzTime = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
            const offset = (tzTime - utcTime) / (1000 * 60 * 60);
            return offset;
        }
        
        // 更新所有時鐘
        function updateClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = '';
            
            cities.forEach((city, index) => {
                const now = new Date();
                const tzTime = new Date(now.toLocaleString('en-US', { timeZone: city.timezone }));
                
                const timeString = formatTime(tzTime);
                const dateString = formatDate(tzTime);
                const offset = getTimezoneOffset(city.timezone);
                const offsetStr = offset >= 0 ? `UTC+${offset}` : `UTC${offset}`;
                
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.innerHTML = `
                    <div class="city-name">${city.name}</div>
                    <div class="time-display">${timeString}</div>
                    <div class="date-display">${dateString}</div>
                    <div class="timezone-info">${offsetStr}</div>
                `;
                
                card.addEventListener('click', () => removeCity(index));
                container.appendChild(card);
            });
            
            // 更新本地時間
            const localTime = document.getElementById('localTime');
            const now = new Date();
            localTime.textContent = formatTime(now);
        }
        
        // 添加時區
        function addClock() {
            const availableCities = moreCities.filter(city => 
                !cities.some(c => c.timezone === city.timezone)
            );
            
            if (availableCities.length === 0) {
                alert('✅ 已添加所有可用時區！');
                return;
            }
            
            const randomCity = availableCities[Math.floor(Math.random() * availableCities.length)];
            cities.push(randomCity);
            updateClocks();
        }
        
        // 移除城市
        function removeCity(index) {
            cities.splice(index, 1);
            updateClocks();
        }
        
        // 重置為預設
        function resetClocks() {
            cities = [...defaultCities];
            updateClocks();
        }
        
        // 初始化
        updateClocks();
        
        // 每秒更新一次
        setInterval(updateClocks, 1000);
    </script>
</body>
</html>
