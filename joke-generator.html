<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.8s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .emoji {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #999;
            font-size: 1em;
        }
        
        .joke-box {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-left: 5px solid #f5576c;
        }
        
        .joke-text {
            color: #333;
            font-size: 1.2em;
            line-height: 1.8;
            font-weight: 500;
        }
        
        .joke-category {
            display: inline-block;
            background: #f5576c;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-top: 15px;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #f5576c;
            font-size: 1.1em;
        }
        
        .spinner {
            border: 4px solid #f5576c;
            border-top: 4px solid transparent;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 35px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: white;
            color: #f5576c;
            border: 2px solid #f5576c;
        }
        
        .btn-secondary:hover {
            background: #f5576c;
            color: white;
        }
        
        .stats {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 0.9em;
        }
        
        .error {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #d32f2f;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="emoji">😂</div>
            <h1>Joke Generator</h1>
            <p class="subtitle">Get a random laugh every time!</p>
        </div>
        
        <div class="error" id="errorMessage"></div>
        
        <div class="joke-box">
            <div id="jokeContent">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Loading a joke...</p>
                </div>
                <div class="joke-text" id="jokeText">
                    Click the button to get a random joke!
                </div>
                <div class="joke-category" id="jokeType" style="display: none;"></div>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" id="generateBtn" onclick="getJoke()">
                Get a Joke 🎉
            </button>
            <button class="btn btn-secondary" onclick="shareJoke()">
                Share 📤
            </button>
        </div>
        
        <div class="stats">
            <p>Jokes generated: <strong id="count">0</strong></p>
        </div>
    </div>

    <script>
        let currentJoke = '';
        let jokeCount = 0;

        async function getJoke() {
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const jokeText = document.getElementById('jokeText');
            const jokeType = document.getElementById('jokeType');
            const errorMessage = document.getElementById('errorMessage');
            
            // Reset error message
            errorMessage.style.display = 'none';
            
            // Show loading state
            btn.disabled = true;
            loading.style.display = 'block';
            jokeText.innerHTML = '';
            jokeType.style.display = 'none';

            try {
                // Using JokeAPI - free API for jokes
                const response = await fetch('https://v2.jokeapi.dev/joke/Any');
                
                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }
                
                const data = await response.json();
                
                // Check if it's a two-part joke or single joke
                if (data.type === 'twopart') {
                    currentJoke = `${data.setup}\n\n${data.delivery}`;
                } else {
                    currentJoke = data.joke;
                }
                
                // Display the joke
                jokeText.innerHTML = currentJoke.replace(/\n/g, '<br>');
                
                // Show category/type
                const category = data.category || 'General';
                jokeType.textContent = category;
                jokeType.style.display = 'inline-block';
                
                // Increment counter
                jokeCount++;
                document.getElementById('count').textContent = jokeCount;
                
            } catch (error) {
                // Show error message
                errorMessage.style.display = 'block';
                errorMessage.textContent = '❌ Oops! Could not load a joke. Please try again!';
                jokeText.innerHTML = 'Sorry, something went wrong. Try again!';
                console.error('Error:', error);
            } finally {
                // Hide loading state
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        function shareJoke() {
            if (currentJoke) {
                // Copy to clipboard
                navigator.clipboard.writeText(currentJoke).then(() => {
                    alert('Joke copied to clipboard! 📋');
                }).catch(() => {
                    // Fallback for older browsers
                    const text = currentJoke;
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('Joke copied to clipboard! 📋');
                });
            } else {
                alert('Please get a joke first! 😄');
            }
        }

        // Load a joke when the page loads
        window.addEventListener('load', () => {
            getJoke();
        });
    </script>
</body>
</html>
