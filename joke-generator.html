<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機笑話生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, '微軟正黑體', '黑體';
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.8s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .back-btn {
            background: transparent;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            transform: scale(1.2);
        }
        
        .emoji {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #999;
            font-size: 1em;
        }
        
        .joke-box {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-left: 5px solid #f5576c;
        }
        
        .joke-text {
            color: #333;
            font-size: 1.2em;
            line-height: 1.8;
            font-weight: 500;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #f5576c;
            font-size: 1.1em;
        }
        
        .spinner {
            border: 4px solid #f5576c;
            border-top: 4px solid transparent;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 35px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: white;
            color: #f5576c;
            border: 2px solid #f5576c;
        }
        
        .btn-secondary:hover {
            background: #f5576c;
            color: white;
        }
        
        .stats {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 0.9em;
        }
        
        .error {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #d32f2f;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="header-top">
                <a href="index.html" class="back-btn" title="回到首頁">🏠</a>
                <div></div>
            </div>
            <div class="emoji">😂</div>
            <h1>笑話生成器</h1>
            <p class="subtitle">每次都能獲得一個隨機笑話！</p>
        </div>
        
        <div class="error" id="errorMessage"></div>
        
        <div class="joke-box">
            <div id="jokeContent">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在加載笑話...</p>
                </div>
                <div class="joke-text" id="jokeText">
                    點擊按鈕獲取一個隨機笑話！
                </div>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" id="generateBtn" onclick="getJoke()">
                來一個笑話 🎉
            </button>
            <button class="btn btn-secondary" onclick="shareJoke()">
                分享 📤
            </button>
        </div>
        
        <div class="stats">
            <p>已生成笑話數：<strong id="count">0</strong> 個</p>
        </div>
    </div>

    <script>
        let currentJoke = '';
        let jokeCount = 0;
        
        // 笑話數據庫（小學生能理解的笑話）
        const chineseJokes = [
            "為什麼小明的成績這麼差？\n因為他爸爸姓差。",
            "雞為什麼過馬路？\n因為它想去另一邊去。",
            "為什麼熊貓是黑白相間的？\n因為它很害羞，用黑白照相機拍的。",
            "問：1+1等於幾？\n答：等於11啊！",
            "為什麼小貓喜歡洗臉？\n因為它想要一張乾淨的臉。",
            "為什麼老師看起來很疲倦？\n因為她整天都在辛苦教書。",
            "為什麼蝴蝶會飛？\n因為它不想走路啦！",
            "為什麼香蕉會笑？\n因為它皮很厚啊！",
            "為什麼烏龜走得很慢？\n因為它背著一個重重的殼。",
            "企鵝為什麼不會唱歌？\n因為它嘴巴被凍住了。",
            "為什麼牛奶是白色的？\n因為牧場的天空是藍色的！",
            "為什麼番茄會臉紅？\n因為它看到了沙拉醬。",
            "為什麼獅子不吃爆米花？\n因為它害怕玉米粒會爆炸！",
            "為什麼西瓜是綠色的？\n因為它在草地上滾動的時候把草的顏色沾上了。",
            "為什麼蛇沒有腳？\n因為它不想被拐賣。",
            "為什麼小鳥會唱歌？\n因為它開心啊！",
            "為什麼狗喜歡搖尾巴？\n因為沒有人幫它搖，所以它自己搖。",
            "為什麼鴨子會游泳？\n因為它忘記了怎麼走路。",
            "為什麼冰淇淋喜歡做夢？\n因為它想融化成湖。",
            "為什麼星星會閃爍？\n因為它在眨眼睛呢！"
        ];

        async function getJoke() {
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const jokeText = document.getElementById('jokeText');
            const errorMessage = document.getElementById('errorMessage');
            
            // 重置錯誤訊息
            errorMessage.style.display = 'none';
            
            // 顯示加載狀態
            btn.disabled = true;
            loading.style.display = 'block';
            jokeText.innerHTML = '';

            try {
                // 隨機選擇一個中文笑話
                const randomIndex = Math.floor(Math.random() * chineseJokes.length);
                currentJoke = chineseJokes[randomIndex];
                
                // 顯示笑話
                jokeText.innerHTML = currentJoke.replace(/\n/g, '<br>');
                
                // 增加計數器
                jokeCount++;
                document.getElementById('count').textContent = jokeCount;
                
            } catch (error) {
                // 顯示錯誤訊息
                errorMessage.style.display = 'block';
                errorMessage.textContent = '❌ 哎呀！無法加載笑話。請重試！';
                jokeText.innerHTML = '抱歉，出現問題了。請重試！';
                console.error('Error:', error);
            } finally {
                // 隱藏加載狀態
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        function shareJoke() {
            if (currentJoke) {
                // 複製到剪貼板
                navigator.clipboard.writeText(currentJoke).then(() => {
                    alert('笑話已複製到剪貼板！📋');
                }).catch(() => {
                    // 舊版瀏覽器的備選方案
                    const text = currentJoke;
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('笑話已複製到剪貼板！📋');
                });
            } else {
                alert('請先獲取一個笑話！😄');
            }
        }

        // 頁面加載時自動載入笑話
        window.addEventListener('load', () => {
            getJoke();
        });
    </script>
</body>
</html>
