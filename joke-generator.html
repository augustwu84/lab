<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>隨機笑話生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, '微軟正黑體', '黑體';
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: rgba(255, 255, 255, 0.95);
            padding: 50px 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.8s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .emoji {
            font-size: 60px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }
        
        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        
        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .subtitle {
            color: #999;
            font-size: 1em;
        }
        
        .joke-box {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            border-left: 5px solid #f5576c;
        }
        
        .joke-text {
            color: #333;
            font-size: 1.2em;
            line-height: 1.8;
            font-weight: 500;
        }
        
        .loading {
            display: none;
            text-align: center;
            color: #f5576c;
            font-size: 1.1em;
        }
        
        .spinner {
            border: 4px solid #f5576c;
            border-top: 4px solid transparent;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 14px 35px;
            font-size: 1em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(245, 87, 108, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(-1px);
        }
        
        .btn-secondary {
            background: white;
            color: #f5576c;
            border: 2px solid #f5576c;
        }
        
        .btn-secondary:hover {
            background: #f5576c;
            color: white;
        }
        
        .stats {
            text-align: center;
            margin-top: 20px;
            color: #999;
            font-size: 0.9em;
        }
        
        .error {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #d32f2f;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="emoji">😂</div>
            <h1>笑話生成器</h1>
            <p class="subtitle">每次都能獲得一個隨機笑話！</p>
        </div>
        
        <div class="error" id="errorMessage"></div>
        
        <div class="joke-box">
            <div id="jokeContent">
                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>正在加載笑話...</p>
                </div>
                <div class="joke-text" id="jokeText">
                    點擊按鈕獲取一個隨機笑話！
                </div>
            </div>
        </div>
        
        <div class="buttons">
            <button class="btn btn-primary" id="generateBtn" onclick="getJoke()">
                來一個笑話 🎉
            </button>
            <button class="btn btn-secondary" onclick="shareJoke()">
                分享 📤
            </button>
        </div>
        
        <div class="stats">
            <p>已生成笑話數：<strong id="count">0</strong> 個</p>
        </div>
    </div>

    <script>
        let currentJoke = '';
        let jokeCount = 0;
        
        // 笑話數據庫（繁體中文笑話）
        const chineseJokes = [
            "為什麼小明的成績這麼差？\n因為他爸爸姓差。",
            "為什麼熊貓那麼貴？\n因為它的代碼是 $panda。",
            "什麼是程序員最喜歡的運動？\n除蟲。",
            "程序員為什麼喜歡喝咖啡？\n因為 Java！",
            "怎樣成為一名成功的程序員？\n睡眠不足 + 咖啡 = 代碼。",
            "一個 SQL 查詢走進一間酒吧，走到兩個表面前說：\n我能加入你們嗎？",
            "為什麼程序員總是混淆萬聖節和聖誕節？\n因為 Oct 31 = Dec 25。",
            "有多少程序員需要來改變一個燈泡？\n一個人。但首先他要檢查棧溢出。",
            "女友問我：你是在看著我，還是在看手機？\n我說：看著你啊。\n她說：那你為什麼一直滑屏？\n我說：我在欣賞你呢。",
            "什麼是程序員的浪漫？\n我對你的愛是用 C++ 寫的，永遠不會被垃圾回收。",
            "程序員的三大謊言：\n1. 我馬上就來\n2. 這是最後一個 Bug\n3. 我已經在做了",
            "為什麼程序員喜歡用黑色主題？\n因為光明太傷眼睛了。",
            "一個程序員走進餐廳說：給我一杯咖啡。\n服務員說：中杯還是大杯？\n程序員說：能不能給我一個無限循環的咖啡？",
            "什麼時候一個程序員會說謊？\n當他的嘴巴在動的時候。",
            "程序員為什麼總是單身？\n因為他們找不到另一半來完成他們的代碼。"
        ];

        async function getJoke() {
            const btn = document.getElementById('generateBtn');
            const loading = document.getElementById('loading');
            const jokeText = document.getElementById('jokeText');
            const errorMessage = document.getElementById('errorMessage');
            
            // 重置錯誤訊息
            errorMessage.style.display = 'none';
            
            // 顯示加載狀態
            btn.disabled = true;
            loading.style.display = 'block';
            jokeText.innerHTML = '';

            try {
                // 隨機選擇一個中文笑話
                const randomIndex = Math.floor(Math.random() * chineseJokes.length);
                currentJoke = chineseJokes[randomIndex];
                
                // 顯示笑話
                jokeText.innerHTML = currentJoke.replace(/\n/g, '<br>');
                
                // 增加計數器
                jokeCount++;
                document.getElementById('count').textContent = jokeCount;
                
            } catch (error) {
                // 顯示錯誤訊息
                errorMessage.style.display = 'block';
                errorMessage.textContent = '❌ 哎呀！無法加載笑話。請重試！';
                jokeText.innerHTML = '抱歉，出現問題了。請重試！';
                console.error('Error:', error);
            } finally {
                // 隱藏加載狀態
                loading.style.display = 'none';
                btn.disabled = false;
            }
        }

        function shareJoke() {
            if (currentJoke) {
                // 複製到剪貼板
                navigator.clipboard.writeText(currentJoke).then(() => {
                    alert('笑話已複製到剪貼板！📋');
                }).catch(() => {
                    // 舊版瀏覽器的備選方案
                    const text = currentJoke;
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    alert('笑話已複製到剪貼板！📋');
                });
            } else {
                alert('請先獲取一個笑話！😄');
            }
        }

        // 頁面加載時自動載入笑話
        window.addEventListener('load', () => {
            getJoke();
        });
    </script>
</body>
</html>
